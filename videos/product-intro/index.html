<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      style="position: relative; width: 1920px; height: 1080px; background: #0a0a0c"
    >
      <div
        id="title-scene"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        style="
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 120px 160px;
          box-sizing: border-box;
        "
      >
        <div
          id="title"
          style="
            color: #f5f5f7;
            font-size: 96px;
            font-weight: 600;
            letter-spacing: 0.01em;
            text-align: center;
          "
        >
          Introducing
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#title", { autoAlpha: 0 });
      tl.to("#title", { autoAlpha: 1, duration: 0.01 }, 0.4);
      tl.from("#title", { opacity: 0, duration: 1.2, ease: "power2.out" }, 0.4);
      tl.to("#title", { opacity: 0, duration: 0.8, ease: "power2.in" }, 9.2);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
